<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goodday - จองกิจกรรม</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Sarabun', sans-serif; background-color: #F3F4F6; }
    .theme-pink { background-color: #d81b60; }
    .theme-text { color: #d81b60; }
    .form-input {
      width: 100%; border: 1px solid #D1D5DB; border-radius: 0.75rem; padding: 0.75rem;
      font-size: 1rem; background-color: white; color: #374151; font-family: 'Sarabun';
    }
    .page-section { display: none; }
    .page-section.active { display: block; }
  </style>
</head>
<body class="antialiased text-gray-800">
  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[10000] w-11/12 max-w-md flex flex-col gap-2"></div>

  <div class="max-w-md mx-auto bg-white min-h-screen relative shadow-lg">

    <!-- หน้า Loading ระหว่างเช็ค login -->
    <div id="loading-view" class="page-section active flex items-center justify-center min-h-screen">
      <div class="text-center">
        <div class="w-12 h-12 border-4 border-pink-100 border-t-pink-600 rounded-full animate-spin mx-auto mb-4"></div>
        <p class="text-gray-400 text-lg font-bold">กำลังเข้าสู่ระบบ...</p>
      </div>
    </div>

    <!-- ถ้ายังไม่เป็นสมาชิก จะเจอหน้านี้ -->
    <div id="not-member-view" class="page-section p-6 pt-16 text-center">
      <div class="w-20 h-20 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center text-4xl mx-auto mb-6">
        <i class="fa-solid fa-user-lock"></i>
      </div>
      <h2 class="text-xl font-black text-gray-800 mb-2">ยังไม่ได้สมัครสมาชิก</h2>
      <p class="text-gray-500 text-base mb-6">กรุณาสมัครสมาชิก Goodday ก่อน<br>จึงจะใช้งานระบบจองกิจกรรมได้</p>
      <button id="btn-go-register" class="w-full theme-pink text-white py-4 rounded-2xl font-bold text-lg">ไปสมัครสมาชิก</button>
    </div>

    <!-- ระบบจองกิจกรรม -->
    <div id="events-view" class="page-section bg-gray-50 min-h-screen pb-24">
      <div class="theme-pink text-white p-4 flex items-center gap-3 sticky top-0 z-40">
        <h2 class="text-xl font-bold">จองกิจกรรม</h2>
      </div>
      <div class="p-4">
        <div class="relative mb-4">
          <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
          <input id="ev-search" type="text" class="form-input pl-11 text-base py-3.5" placeholder="ค้นหากิจกรรมที่น่าสนใจ...">
        </div>
        <div id="ev-category-tabs" class="flex gap-2 overflow-x-auto pb-3 mb-2"></div>
        <div class="flex gap-2 mb-4">
          <button id="ev-filter-mine" class="flex-1 py-2.5 rounded-xl text-base font-bold border-2">จังหวัดของฉัน</button>
          <button id="ev-filter-all" class="flex-1 py-2.5 rounded-xl text-base font-bold border-2">ทุกจังหวัด</button>
        </div>
        <div id="ev-list-container" class="space-y-4"></div>
      </div>

      <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-200 flex z-50">
        <button id="ev-tab-events" class="flex-1 py-3 flex flex-col items-center gap-1 theme-text">
          <i class="fa-solid fa-list text-xl"></i><span class="text-sm font-bold">กิจกรรม</span>
        </button>
        <button id="ev-tab-calendar" class="flex-1 py-3 flex flex-col items-center gap-1 text-gray-400">
          <i class="fa-solid fa-calendar-days text-xl"></i><span class="text-sm font-bold">ปฏิทิน</span>
        </button>
        <button id="ev-tab-history" class="flex-1 py-3 flex flex-col items-center gap-1 text-gray-400">
          <i class="fa-solid fa-clock-rotate-left text-xl"></i><span class="text-sm font-bold">ประวัติ</span>
        </button>
      </div>
    </div>

    <div id="events-calendar-view" class="page-section bg-gray-50 min-h-screen pb-24">
      <div class="theme-pink text-white p-4"><h2 class="text-xl font-bold">ปฏิทินกิจกรรม</h2></div>
      <div class="p-6 text-center text-gray-400 text-lg">🚧 กำลังพัฒนา</div>
    </div>

    <div id="events-history-view" class="page-section bg-gray-50 min-h-screen pb-24">
      <div class="theme-pink text-white p-4"><h2 class="text-xl font-bold">ประวัติกิจกรรม</h2></div>
      <div class="p-6 text-center text-gray-400 text-lg">🚧 กำลังพัฒนา</div>
    </div>

  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
